<!--page {"title": "Contact us | Klass8", "desc": "Write to the Klass8 team about the app, a payment, a school licence or your account."} -->
<section class="phero phero--plain">
  <div class="wrap phero__in">
    <h1>Contact us</h1>
    <p>Questions about the app, a payment, a school licence or your account. We answer {{HOURS}}.</p>
  </div>
</section>

<section class="sec">
  <div class="wrap split" style="align-items: start">
    <div class="split__copy">
      <h2>Send us a message</h2>
      <p>For help with a payment, give the phone number of your Klass8 account and the payment reference shown in the app. Read the <a href="/refunds">refund policy</a>.</p>
      {{CONTACT_CARDS}}
    </div>
    <form class="form split__media" data-contact novalidate>
      <label>Your name
        <input name="name" autocomplete="name" required maxlength="80">
      </label>
      <label>Phone number or email, so we can answer you
        <input name="contact" autocomplete="email" required maxlength="120">
      </label>
      <label>About
        <select name="topic">
          <option value="app">Using the app</option>
          <option value="payment">A payment</option>
          <option value="school">A school licence</option>
          <option value="account">My account or my data</option>
          <option value="other">Something else</option>
        </select>
      </label>
      <label>Your message
        <textarea name="message" required maxlength="3000"></textarea>
      </label>
      <button class="btn btn--navy btn--lg" type="submit">Send the message</button>
      <p data-out aria-live="polite"></p>
    </form>
  </div>
</section>
