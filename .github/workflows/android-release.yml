name: Android APK release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# One build at a time, newest push wins, so the "latest" release and the
# download page always carry the newest commit.
concurrency:
  group: android-release
  cancel-in-progress: true

jobs:
  android:
    name: Build & publish APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --clean
        env:
          # Optional: set a repository variable so Ask AI knows where the proxy server is.
          EXPO_PUBLIC_AI_PROXY_URL: ${{ vars.AI_PROXY_URL }}

      - name: Build release APK
        working-directory: android
        env:
          EXPO_PUBLIC_AI_PROXY_URL: ${{ vars.AI_PROXY_URL }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Collect APK
        # Klass8.apk is the current name; ScienceAid.apk and SciAid.apk keep links shared before the renames working.
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Klass8.apk
          cp Klass8.apk ScienceAid.apk
          cp Klass8.apk SciAid.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: klass8-android
          path: Klass8.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Klass8 v1.0.${{ github.run_number }}
          make_latest: true
          body: |
            Android APK for Klass8 (Cameroon secondary school courses, GCE and class exams).
            Download **Klass8.apk** below, open it on your phone and allow "install unknown apps" when asked.
          files: |
            Klass8.apk
            ScienceAid.apk
            SciAid.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare the download site
        # The page starts the download as soon as it opens; the APK sits beside it.
        run: |
          mkdir -p site
          cp .github/pages/index.html site/index.html
          cp Klass8.apk site/Klass8.apk

      - name: Publish the download site to gh-pages
        # Served by GitHub Pages once Pages is set to deploy from the gh-pages branch.
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site
          publish_branch: gh-pages
          force_orphan: true
          commit_message: Klass8 v1.0.${{ github.run_number }} download site
