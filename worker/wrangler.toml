name = "biospatial-vr-ai"
main = "src/index.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# 3D models (built by tools/models). The Worker runs first for every request, so
# the files are only reachable through the signed /v1/models routes.
[assets]
directory = "./assets"
binding = "ASSETS"
run_worker_first = true

[observability]
enabled = true

[vars]
FAPSHI_ENV = "sandbox"
# Browser origins allowed to call the API (web preview only; the app is native).
ALLOWED_ORIGINS = "http://localhost:8081"
# Characters of new natural-voice speech allowed per day across all users.
VOICE_DAILY_CHARS = "400000"
# "melo" fits the Workers free allowance; "aura" (British voices) needs Workers Paid.
VOICE_ENGINE = "melo"

[[d1_databases]]
binding = "DB"
database_name = "biospatial-db"
database_id = "d8d1baf5-4674-4d58-9b37-06df069e22ea"
migrations_dir = "migrations"

[triggers]
crons = ["0 17 * * *"]

# Rate limits are keyed per IP, per phone or per user inside the handlers.
[[ratelimits]]
name = "AUTH_LIMITER"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 10
  period = 60

[[ratelimits]]
name = "OTP_LIMITER"
namespace_id = "1002"
  [ratelimits.simple]
  limit = 2
  period = 60

[[ratelimits]]
name = "AI_LIMITER"
namespace_id = "1003"
  [ratelimits.simple]
  limit = 8
  period = 60

[[ratelimits]]
name = "WRITE_LIMITER"
namespace_id = "1004"
  [ratelimits.simple]
  limit = 20
  period = 60

[[ratelimits]]
name = "VOICE_LIMITER"
namespace_id = "1005"
  [ratelimits.simple]
  limit = 40
  period = 60

# Workers AI makes the tutor's natural voice; finished audio is kept in KV.
[ai]
binding = "AI"
# Local `wrangler dev` calls the real Workers AI as well (small cost per test).
remote = true

[[kv_namespaces]]
binding = "VOICE_CACHE"
id = "e0d1e3131791462b8e6cdb79bcd67042"

# Secrets (set with `npx wrangler secret put <NAME>`, never committed):
#   JWT_SECRET             required, 64+ random characters
#   GROQ_API_KEY           AI tutor and marking (primary provider)
#   ANTHROPIC_API_KEY      optional alternative, used when AI_PROVIDER = "anthropic"
#   FAPSHI_API_USER / FAPSHI_API_KEY / FAPSHI_WEBHOOK_SECRET   payments (set FAPSHI_ENV = "live" for real money)
#   Messaging, any of (tried in this order):
#     WHATSAPP_TOKEN / WHATSAPP_PHONE_ID (+ WHATSAPP_CODE_TEMPLATE, WHATSAPP_CONSENT_TEMPLATE, WHATSAPP_ALERT_TEMPLATE)
#     ORANGE_CLIENT_ID / ORANGE_CLIENT_SECRET / ORANGE_SENDER (+ ORANGE_SENDER_NAME)
#     AT_USERNAME / AT_API_KEY (+ AT_SENDER_ID)       Africa's Talking
#     TWILIO_ACCOUNT_SID / TWILIO_AUTH_TOKEN / TWILIO_FROM
#   SUPPORT_EMAIL          shown on the parent consent page
#   ADMIN_TOKEN            operator endpoints (voucher creation), 32+ characters
