name = "biospatial-vr-ai"
main = "src/index.js"
compatibility_date = "2026-09-01"

[vars]
ANTHROPIC_MODEL = "claude-sonnet-5"
# Browser origins allowed to call the API (the mobile app itself needs none).
ALLOWED_ORIGINS = ""

# Per-device limit: 10 questions per minute, keyed on CF-Connecting-IP.
[[ratelimits]]
name = "ASK_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 10
  period = 60

# Secrets (set with `npx wrangler secret put <NAME>`, never committed):
#   ANTHROPIC_API_KEY  — required
#   APP_PASSCODE       — optional class passcode
