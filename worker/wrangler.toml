name = "biospatial-vr-ai"
main = "src/index.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[observability]
enabled = true

[vars]
FAPSHI_ENV = "sandbox"
# Browser origins allowed to call the API (web preview only; the app is native).
ALLOWED_ORIGINS = "http://localhost:8081"

[[d1_databases]]
binding = "DB"
database_name = "biospatial-db"
database_id = "d8d1baf5-4674-4d58-9b37-06df069e22ea"
migrations_dir = "migrations"

[triggers]
crons = ["0 17 * * *"]

# Rate limits are keyed per IP, per phone or per user inside the handlers.
[[ratelimits]]
name = "AUTH_LIMITER"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 10
  period = 60

[[ratelimits]]
name = "OTP_LIMITER"
namespace_id = "1002"
  [ratelimits.simple]
  limit = 2
  period = 60

[[ratelimits]]
name = "AI_LIMITER"
namespace_id = "1003"
  [ratelimits.simple]
  limit = 8
  period = 60

[[ratelimits]]
name = "WRITE_LIMITER"
namespace_id = "1004"
  [ratelimits.simple]
  limit = 20
  period = 60

# Secrets (set with `npx wrangler secret put <NAME>`, never committed):
#   JWT_SECRET             required, 64+ random characters
#   GROQ_API_KEY           AI tutor and marking (primary provider)
#   ANTHROPIC_API_KEY      optional alternative, used when AI_PROVIDER = "anthropic"
#   FAPSHI_API_USER / FAPSHI_API_KEY / FAPSHI_WEBHOOK_SECRET   payments (set FAPSHI_ENV = "live" for real money)
#   TWILIO_ACCOUNT_SID / TWILIO_AUTH_TOKEN / TWILIO_FROM       SMS codes and parent alerts
#   ADMIN_TOKEN            operator endpoints (voucher creation), 32+ characters
